<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Elections - Electo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1f2937;
        }

        .topbar {
            background: linear-gradient(135deg, #312e81, #4f46e5);
            color: white;
            padding: 22px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .admin-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .page-heading h1 {
            font-size: 32px;
            color: #111827;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #6b7280;
            font-size: 16px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 28px;
            align-items: start;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
            border: 1px solid #e5e7eb;
        }

        .card h2 {
            font-size: 21px;
            color: #312e81;
            margin-bottom: 8px;
        }

        .card-description {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #f9fafb;
        }

        input:focus,
        textarea:focus {
            border-color: #4f46e5;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 13px 18px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-secondary {
            background: #eef2ff;
            color: #4338ca;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #e0e7ff;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .elections-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .elections-header h2 {
            margin-bottom: 0;
        }

        .count-badge {
            background: #eef2ff;
            color: #4338ca;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .election-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .election-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 21px;
            background: #ffffff;
            transition: 0.2s;
        }

        .election-card:hover {
            border-color: #a5b4fc;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.08);
        }

        .election-title {
            font-size: 19px;
            font-weight: 750;
            color: #111827;
            margin-bottom: 8px;
        }

        .election-description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .date-box {
            background: #f9fafb;
            border-radius: 9px;
            padding: 11px;
        }

        .date-label {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .date-value {
            font-size: 13px;
            color: #374151;
            font-weight: 600;
            word-break: break-word;
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }

        .status-upcoming {
            background: #fef3c7;
            color: #92400e;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-completed {
            background: #e5e7eb;
            color: #374151;
        }

        .delete-btn {
            border: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty-state {
            text-align: center;
            padding: 45px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        @media (max-width: 900px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 20px 25px;
            }
        }

        @media (max-width: 600px) {
            .main-container {
                width: 94%;
                margin: 25px auto;
            }

            .page-heading h1 {
                font-size: 27px;
            }

            .card {
                padding: 22px;
            }

            .date-row {
                grid-template-columns: 1fr;
            }

            .bottom-row {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="logo">ELECTO</div>

        <div class="admin-label">
            Admin Panel
        </div>
    </header>

    <main class="main-container">

        <section class="page-heading">
            <h1>Manage Elections</h1>
            <p>Create, monitor and manage independent elections.</p>
        </section>

        <div class="content-grid">

            <!-- Create Election Section -->
            <section class="card">

                <h2>Create Election</h2>

                <p class="card-description">
                    Add a new election by entering its details and schedule.
                </p>

                <form id="electionForm">

                    <div class="form-group">
                        <label for="name">Election Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Example: Sports Elections 2026"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>

                        <textarea
                            id="description"
                            placeholder="Enter election description"
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="startTime">Start Date & Time</label>

                        <input
                            type="datetime-local"
                            id="startTime"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="endTime">End Date & Time</label>

                        <input
                            type="datetime-local"
                            id="endTime"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Create Election
                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary"
                        onclick="window.location.href='admin-dashboard.html'">
                        Back to Admin Dashboard
                    </button>

                    <div id="message" class="message"></div>

                </form>

            </section>

            <!-- Existing Elections Section -->
            <section class="card">

                <div class="elections-header">
                    <h2>Existing Elections</h2>

                    <span
                        id="electionCount"
                        class="count-badge">
                        0 Elections
                    </span>
                </div>

                <div
                    id="electionList"
                    class="election-list">

                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>Loading elections...</p>
                    </div>

                </div>

            </section>

        </div>

    </main>

    <script>

        const API = "https://electo-backend-xi.vercel.app/api";

        const electionForm =
            document.getElementById("electionForm");

        const electionList =
            document.getElementById("electionList");

        const electionCount =
            document.getElementById("electionCount");

        const message =
            document.getElementById("message");


        function formatDate(dateValue) {

            if (!dateValue) {
                return "Not available";
            }

            const date = new Date(dateValue);

            return date.toLocaleString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }


        function getStatus(election) {

            const now = new Date();

            const start = new Date(election.startTime);
            const end = new Date(election.endTime);

            if (now < start) {
                return "UPCOMING";
            }

            if (now >= end) {
                return "COMPLETED";
            }

            return "ACTIVE";
        }


        function getStatusClass(status) {

            if (status === "UPCOMING") {
                return "status-upcoming";
            }

            if (status === "ACTIVE") {
                return "status-active";
            }

            return "status-completed";
        }


        async function loadElections() {

            try {

                const response = await fetch(
                    `${API}/elections`
                );

                if (!response.ok) {
                    throw new Error("Unable to load elections.");
                }

                const elections = await response.json();

                electionList.innerHTML = "";

                electionCount.textContent =
                    `${elections.length} Election${elections.length !== 1 ? "s" : ""}`;

                if (elections.length === 0) {

                    electionList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🗳️</div>
                            <p>No elections created yet.</p>
                        </div>
                    `;

                    return;
                }

                elections.forEach(function (election) {

                    const status =
                        getStatus(election);

                    const statusClass =
                        getStatusClass(status);

                    const card =
                        document.createElement("div");

                    card.className = "election-card";

                    card.innerHTML = `
                        <div class="election-title">
                            ${escapeHTML(election.name)}
                        </div>

                        <div class="election-description">
                            ${escapeHTML(election.description || "No description provided.")}
                        </div>

                        <div class="date-row">

                            <div class="date-box">
                                <span class="date-label">
                                    Start Date & Time
                                </span>

                                <span class="date-value">
                                    ${formatDate(election.startTime)}
                                </span>
                            </div>

                            <div class="date-box">
                                <span class="date-label">
                                    End Date & Time
                                </span>

                                <span class="date-value">
                                    ${formatDate(election.endTime)}
                                </span>
                            </div>

                        </div>

                        <div class="bottom-row">

                            <span class="status ${statusClass}">
                                ${status}
                            </span>

                            <button
                                class="delete-btn"
                                onclick="deleteElection(${election.id})">
                                Delete
                            </button>

                        </div>
                    `;

                    electionList.appendChild(card);

                });

            } catch (error) {

                console.error(error);

                electionList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Unable to load elections.</p>
                        <p>Please check whether Spring Boot is running.</p>
                    </div>
                `;

            }

        }


        electionForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                message.className = "message";
                message.textContent = "";

                const name =
                    document.getElementById("name")
                        .value.trim();

                const description =
                    document.getElementById("description")
                        .value.trim();

                const startTime =
                    document.getElementById("startTime")
                        .value;

                const endTime =
                    document.getElementById("endTime")
                        .value;

                if (!name || !description || !startTime || !endTime) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Please fill all the fields.";

                    return;
                }

                if (new Date(endTime) <= new Date(startTime)) {

                    message.className =
                        "message error";

                    message.textContent =
                        "End date and time must be after start date and time.";

                    return;
                }

                try {

                    const response = await fetch(
                        `${API}/elections`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                description: description,
                                startTime: startTime,
                                endTime: endTime
                            })
                        }
                    );

                    const result =
                        await response.text();

                    if (!response.ok) {

                        message.className =
                            "message error";

                        message.textContent =
                            result;

                        return;
                    }

                    message.className =
                        "message success";

                    message.textContent =
                        "Election created successfully!";

                    electionForm.reset();

                    loadElections();

                } catch (error) {

                    console.error(error);

                    message.className =
                        "message error";

                    message.textContent =
                        "Unable to connect to the server.";

                }

            }
        );


        async function deleteElection(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this election?"
                );

            if (!confirmDelete) {
                return;
            }

            try {

                const response = await fetch(
                    `${API}/elections/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                const result =
                    await response.text();

                if (!response.ok) {

                    alert(result);
                    return;
                }

                alert("Election deleted successfully.");

                loadElections();

            } catch (error) {

                console.error(error);

                alert(
                    "Unable to delete election. Check the server."
                );

            }

        }


        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        loadElections();

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electo - Manage Candidates</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            background: #111827;
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header h1 {
            margin-top: 10px;
            font-size: 28px;
        }

        .email {
            margin-top: 8px;
            color: #d1d5db;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 18px;
            color: #111827;
        }

        .election-box {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 18px;
            background: #111827;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-btn {
            background: #6b7280;
            margin-left: 10px;
        }

        .candidate {
            border: 1px solid #e5e7eb;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .candidate h3 {
            margin-bottom: 8px;
        }

        .candidate p {
            margin: 5px 0;
            color: #4b5563;
        }

        .candidate-photo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            background: #f3f4f6;
        }

        .delete-btn {
            background: #dc2626;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .empty {
            color: #6b7280;
        }

        .upload-status {
            margin-top: 8px;
            font-size: 14px;
            color: #6b7280;
        }
    </style>

</head>


<body>

    <div class="container">


        <!-- =============================== -->
        <!-- HEADER -->
        <!-- =============================== -->

        <div class="header">

            <div class="logo">
                ELECTO
            </div>

            <h1>
                Manage Candidates
            </h1>

            <div class="email" id="adminEmail">
            </div>

        </div>


        <!-- =============================== -->
        <!-- SELECTED ELECTION -->
        <!-- =============================== -->

        <div class="card">

            <h2>
                Selected Election
            </h2>

            <div class="election-box" id="electionDetails">

                Loading election...

            </div>

        </div>


        <!-- =============================== -->
        <!-- ADD CANDIDATE -->
        <!-- =============================== -->

        <div class="card">

            <h2>
                Add Candidate
            </h2>


            <form id="candidateForm">


                <!-- CANDIDATE NAME -->

                <label for="candidateName">
                    Candidate Name
                </label>

                <input type="text" id="candidateName" placeholder="Enter candidate name" required>


                <!-- EMAIL -->

                <label for="candidateEmail">
                    Candidate Email
                </label>

                <input type="email" id="candidateEmail" placeholder="Enter candidate email">


                <!-- POSITION -->

                <label for="position">
                    Position
                </label>

                <select id="position" required>

                    <option value="">
                        Select Position
                    </option>

                </select>


                <!-- PHOTO -->

                <label for="photo">
                    Profile Photo
                </label>

                <input type="file" id="photo" accept="image/jpeg,image/png">

                <div class="upload-status" id="uploadStatus">
                </div>


                <!-- BIOGRAPHY -->

                <label for="biography">
                    Candidate Biography
                </label>

                <textarea id="biography" placeholder="Enter candidate biography"></textarea>


                <!-- SUBMIT -->

                <button type="submit" id="addCandidateButton">

                    Add Candidate

                </button>

            </form>


            <div class="message" id="message">
            </div>

        </div>


        <!-- =============================== -->
        <!-- REGISTERED CANDIDATES -->
        <!-- =============================== -->

        <div class="card">

            <h2>
                Registered Candidates
            </h2>

            <div id="candidateList">

                <p class="empty">
                    Loading candidates...
                </p>

            </div>

        </div>


        <!-- =============================== -->
        <!-- BACK -->
        <!-- =============================== -->

        <button class="back-btn" onclick="goBack()">

            Back to Dashboard

        </button>


    </div>


    <script>
        const API = "https://electo-7p79.onrender.com/api";

        let currentElection = null;

        document.getElementById("adminEmail").innerText = localStorage.getItem("userEmail") || "";

        const role = localStorage.getItem("userRole");

        if (role !== "ADMIN") {
            alert("Admin access required.");
            window.location.href = "index.html";
        }

        async function loadElection() {
            try {
                const response = await fetch(API + "/elections");

                if (!response.ok) {
                    throw new Error("Unable to load elections.");
                }

                const elections = await response.json();

                if (!elections || elections.length === 0) {
                    document.getElementById("electionDetails").innerText = "No elections available.";
                    return;
                }

                const savedElection = JSON.parse(localStorage.getItem("selectedElection"));

                if (savedElection && savedElection.id) {
                    currentElection = elections.find(election => String(election.id) === String(savedElection.id));
                }

                if (!currentElection) {
                    currentElection = elections[elections.length - 1];
                }

                localStorage.setItem("selectedElection", JSON.stringify(currentElection));

                document.getElementById("electionDetails").innerText = currentElection.name + " (ID: " + currentElection.id + ")";

                await loadPositions();
                await loadCandidates();
            } catch (error) {
                console.error("Election loading error:", error);
                document.getElementById("electionDetails").innerText = "Unable to load election.";
            }
        }

        async function loadPositions() {
            const positionSelect = document.getElementById("position");
            positionSelect.innerHTML = '<option value="">Select Position</option>';

            if (!currentElection) {
                return;
            }

            try {
                const response = await fetch(API + "/positions/election/" + currentElection.id);

                if (!response.ok) {
                    throw new Error("Unable to load positions.");
                }

                const positions = await response.json();

                console.log("Backend positions:", positions);

                if (!positions || positions.length === 0) {
                    positionSelect.innerHTML = '<option value="">No positions added yet</option>';
                    return;
                }

                const elections = JSON.parse(localStorage.getItem("elections")) || [];
                const selectedElection = elections.find(election => String(election.id) === String(currentElection.id));
                const localPositions = selectedElection ? selectedElection.positions || [] : [];

                positions.forEach(position => {
                    const option = document.createElement("option");
                    option.value = position.id;

                    const localPosition = localPositions.find(
                        p => String(p.name).trim().toLowerCase() === String(position.name).trim().toLowerCase()
                    );

                    const seats = localPosition && localPosition.seats ? localPosition.seats : 1;

                    option.textContent = position.name + " (" + seats + " seat" + (seats > 1 ? "s" : "") + ")";
                    positionSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Unable to load positions:", error);
                positionSelect.innerHTML = '<option value="">Unable to load positions</option>';
            }
        }

        async function uploadCandidatePhoto(candidateId, photoFile) {
            if (!["image/jpeg", "image/png"].includes(photoFile.type)) {
                throw new Error("Only JPEG and PNG images are allowed.");
            }

            if (photoFile.size > 150 * 1024) {
                throw new Error("Image must be 150 KB or smaller.");
            }

            const formData = new FormData();
            formData.append("file", photoFile);

            const response = await fetch(
                API + "/candidates/" + encodeURIComponent(candidateId) + "/photo",
                {
                    method: "PUT",
                    body: formData
                }
            );

            if (!response.ok) {
                throw new Error(
                    (await response.text()) || "Photo upload failed."
                );
            }

            return response.json();
        }

        document.getElementById("candidateForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            if (!currentElection) {
                alert("No election selected.");
                return;
            }

            const message = document.getElementById("message");
            const uploadStatus = document.getElementById("uploadStatus");
            const addButton = document.getElementById("addCandidateButton");

            const name = document.getElementById("candidateName").value.trim();
            const email = document.getElementById("candidateEmail").value.trim();
            const positionId = Number(
                document.getElementById("position").value
            );
            const biography = document.getElementById("biography").value.trim();
            const photoFile = document.getElementById("photo").files[0];

            if (!name) {
                alert("Candidate name is required.");
                return;
            }

            if (!Number.isInteger(positionId) || positionId <= 0) {
                alert("Please select a valid position.");
                return;
            }

            // Validate before creating the candidate to avoid an avoidable
            // partial result if the selected file is too large or unsupported.
            if (photoFile) {
                if (!["image/jpeg", "image/png"].includes(photoFile.type)) {
                    alert("Only JPEG and PNG images are allowed.");
                    return;
                }

                if (photoFile.size > 150 * 1024) {
                    alert("Image must be 150 KB or smaller.");
                    return;
                }
            }

            addButton.disabled = true;
            message.textContent = "";
            uploadStatus.textContent = "";

            let savedCandidate = null;

            try {
                const candidate = {
                    name,
                    email,
                    electionId: Number(currentElection.id),
                    positionId,
                    biography
                };

                message.textContent = "Saving candidate...";

                const response = await fetch(API + "/candidates", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(candidate)
                });

                if (!response.ok) {
                    throw new Error(
                        (await response.text()) || "Unable to add candidate."
                    );
                }

                savedCandidate = await response.json();

                if (!savedCandidate.id) {
                    throw new Error("Candidate was saved without an ID.");
                }

                if (photoFile) {
                    uploadStatus.textContent = "Uploading photo...";
                    await uploadCandidatePhoto(savedCandidate.id, photoFile);
                    uploadStatus.textContent = "Photo saved successfully.";
                } else {
                    uploadStatus.textContent = "No photo selected.";
                }

                message.textContent = "Candidate added successfully.";
                message.style.color = "green";

                document.getElementById("candidateForm").reset();
                await loadCandidates();
            } catch (error) {
                console.error("Candidate error:", error);

                message.textContent = savedCandidate
                    ? `Candidate ${savedCandidate.id} was created, but the photo or page refresh failed: ${error.message}. Do not submit the form again.`
                    : "Error: " + error.message;

                message.style.color = "red";
            } finally {
                addButton.disabled = false;
            }
        }
        );

        async function loadCandidates() {
            const list = document.getElementById("candidateList");

            if (!currentElection) {
                list.innerHTML = "<p class='empty'>No election selected.</p>";
                return;
            }

            try {
                const response = await fetch(
                    API + "/candidates/election/" +
                    encodeURIComponent(currentElection.id)
                );

                if (!response.ok) {
                    throw new Error("Unable to load candidates.");
                }

                const candidates = await response.json();

                if (!Array.isArray(candidates) || candidates.length === 0) {
                    list.innerHTML =
                        "<p class='empty'>No candidates added yet.</p>";
                    return;
                }

                list.innerHTML = "";
                const backendOrigin = new URL(API).origin;

                candidates.forEach(candidate => {
                    const div = document.createElement("div");
                    div.className = "candidate";

                    let photoHTML = "";

                    if (candidate.photo) {
                        const storedPath = candidate.photo.trim();
                        let photoUrl;

                        if (/^https?:\/\//i.test(storedPath)) {
                            photoUrl = storedPath;
                        } else if (storedPath.startsWith("/")) {
                            // Handles /uploads/... and /api/candidates/{id}/photo.
                            photoUrl = backendOrigin + storedPath;
                        } else {
                            // Supports older records containing only a filename.
                            photoUrl =
                                backendOrigin +
                                "/uploads/" +
                                encodeURIComponent(storedPath);
                        }

                        photoHTML = `
                    <img
                        src="${escapeHtml(photoUrl)}"
                        alt="Candidate Photo"
                        class="candidate-photo"
                        onerror="this.style.display='none';"
                    >
                `;
                    }

                    div.innerHTML = `
                ${photoHTML}
                <h3>${escapeHtml(candidate.name || "")}</h3>
                <p><strong>Email:</strong>
                    ${escapeHtml(candidate.email || "Not provided")}
                </p>
                <p><strong>Position ID:</strong>
                    ${escapeHtml(candidate.positionId ?? "-")}
                </p>
                <p><strong>Biography:</strong>
                    ${escapeHtml(candidate.biography || "Not provided")}
                </p>
                <button class="delete-btn" type="button">
                    Delete
                </button>
            `;

                    div.querySelector(".delete-btn").addEventListener(
                        "click",
                        () => deleteCandidate(candidate.id)
                    );

                    list.appendChild(div);
                });

            } catch (error) {
                console.error("Candidate loading error:", error);
                list.innerHTML =
                    "<p class='empty'>Unable to load candidates.</p>";
            }
        }

        async function deleteCandidate(id) {
            if (!confirm("Are you sure you want to delete this candidate?")) {
                return;
            }

            try {
                const response = await fetch(API + "/candidates/" + id, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                await loadCandidates();
            } catch (error) {
                alert("Unable to delete candidate: " + error.message);
            }
        }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value;
            return div.innerHTML;
        }

        function goBack() {
            window.location.href = "admin-dashboard.html";
        }

        loadElection();
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Results - Electo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        .user-info {
            text-align: right;
            font-size: 14px;
            line-height: 1.6;
        }

        .container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            color: #111827;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #666;
        }

        /* ELECTION CARD */

        .election-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        .election-card h3 {
            margin-bottom: 10px;
            color: #111827;
        }

        .election-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        /* SUMMARY */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        .summary-card h4 {
            color: #666;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .summary-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #111827;
        }

        /* RESULTS */

        .position-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        .position-title {
            font-size: 22px;
            color: #111827;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eee;
        }

        .candidate-list {
            display: grid;
            gap: 15px;
        }

        .candidate-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;

            display: flex;
            align-items: center;
            gap: 20px;
        }

        .candidate-photo {
            width: 110px;
            height: 110px;

            border-radius: 10px;
            border: 1px solid #ddd;

            object-fit: contain;
            background: #f8f8f8;

            flex-shrink: 0;
        }

        .candidate-info {
            flex: 1;
        }

        .candidate-info h4 {
            font-size: 19px;
            margin-bottom: 6px;
            color: #111827;
        }

        .candidate-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .vote-count {
            text-align: center;
            min-width: 100px;
        }

        .vote-count .number {
            font-size: 27px;
            font-weight: bold;
            color: #2563eb;
        }

        .vote-count p {
            font-size: 13px;
            color: #666;
        }

        .percentage {
            min-width: 100px;
            text-align: center;
        }

        .percentage .number {
            font-size: 20px;
            font-weight: bold;
            color: #111827;
        }

        .percentage p {
            font-size: 13px;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }

        .leading {
            background: #dcfce7;
            color: #166534;
        }

        .tie {
            background: #fef3c7;
            color: #92400e;
        }

        /* NO DATA */

        .no-data {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            color: #666;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .loading {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            color: #666;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        /* BACK BUTTON */

        .back-container {
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .back-btn {
            background: #111827;
            color: white;

            border: none;
            padding: 12px 22px;

            border-radius: 7px;

            font-size: 15px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #1f2937;
        }

        @media (max-width: 850px) {

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .candidate-card {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .user-info {
                text-align: left;
            }

            .candidate-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .candidate-photo {
                width: 150px;
                height: 150px;
            }

            .vote-count,
            .percentage {
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>Electo</h1>

        <div class="user-info">

            <div id="adminEmail">
                Loading...
            </div>

            <div>
                Role: ADMIN
            </div>

        </div>

    </header>


    <!-- MAIN -->

    <div class="container">

        <div class="page-title">

            <h2>
                Election Results
            </h2>

            <p>
                View position-wise voting results and candidate performance.
            </p>

        </div>


        <!-- ELECTION INFORMATION -->

        <div class="election-card" id="electionCard">

            <h3>
                Loading election...
            </h3>

            <p>
                Please wait while election data is loaded.
            </p>

        </div>


        <!-- SUMMARY -->

        <div class="summary-grid">

            <div class="summary-card">

                <h4>
                    Registered Voters
                </h4>

                <div class="number" id="totalVoters">
                    0
                </div>

            </div>


            <div class="summary-card">

                <h4>
                    Voters Who Voted
                </h4>

                <div class="number" id="votersWhoVoted">
                    0
                </div>

            </div>


            <div class="summary-card">

                <h4>
                    Total Vote Records
                </h4>

                <div class="number" id="totalVotes">
                    0
                </div>

            </div>

        </div>


        <!-- RESULTS -->

        <div id="resultsContainer">

            <div class="loading">
                Loading results...
            </div>

        </div>


        <!-- BACK -->

        <div class="back-container">

            <button class="back-btn" onclick="goBack()">
                ← Back to Dashboard
            </button>

        </div>

    </div>


    <script>

        // ==========================================
        // API
        // ==========================================

        const API =
            "https://electo-7p79.onrender.com/api";


        // ==========================================
        // LOGIN / ROLE CHECK
        // ==========================================

        const userEmail =
            localStorage.getItem("userEmail");

        const userRole =
            localStorage.getItem("userRole");


        if (!userEmail || !userRole) {

            alert("Please login first.");

            window.location.href =
                "index.html";

        }


        if (userRole !== "ADMIN") {

            alert("Access denied. Admin only.");

            window.location.href =
                "admin-dashboard.html";

        }


        document.getElementById("adminEmail").textContent =
            userEmail;


        // ==========================================
        // DOM ELEMENTS
        // ==========================================

        const electionCard =
            document.getElementById("electionCard");

        const resultsContainer =
            document.getElementById("resultsContainer");


        // ==========================================
        // SELECTED ELECTION
        // ==========================================

        let currentElection = null;
        let positions = [];
        let candidates = [];
        let votes = [];


        // ==========================================
        // LOAD EVERYTHING
        // ==========================================

        async function loadResults() {

            try {

                resultsContainer.innerHTML = `
                    <div class="loading">
                        Loading results...
                    </div>
                `;


                // --------------------------------------
                // GET SELECTED ELECTION
                // --------------------------------------

                const storedElection =
                    JSON.parse(
                        localStorage.getItem("selectedElection")
                    );


                const electionResponse =
                    await fetch(`${API}/elections`);


                if (!electionResponse.ok) {

                    throw new Error(
                        "Unable to load elections."
                    );

                }


                const allElections =
                    await electionResponse.json();


                if (storedElection && storedElection.id) {

                    currentElection =
                        allElections.find(
                            election =>
                                Number(election.id) ===
                                Number(storedElection.id)
                        );

                }


                // Fallback: use last election

                if (!currentElection &&
                    allElections.length > 0) {

                    currentElection =
                        allElections[allElections.length - 1];

                }


                if (!currentElection) {

                    showNoElection();

                    return;

                }


                // --------------------------------------
                // DISPLAY ELECTION
                // --------------------------------------

                displayElection();


                // --------------------------------------
                // LOAD POSITIONS
                // --------------------------------------

                const positionsResponse =
                    await fetch(
                        `${API}/positions/election/${currentElection.id}`
                    );


                if (!positionsResponse.ok) {

                    throw new Error(
                        "Unable to load positions."
                    );

                }


                positions =
                    await positionsResponse.json();


                // --------------------------------------
                // LOAD CANDIDATES
                // --------------------------------------

                const candidatesResponse =
                    await fetch(
                        `${API}/candidates/election/${currentElection.id}`
                    );


                if (!candidatesResponse.ok) {

                    throw new Error(
                        "Unable to load candidates."
                    );

                }


                candidates =
                    await candidatesResponse.json();


                // --------------------------------------
                // LOAD ALL VOTES
                // --------------------------------------

                const votesResponse =
                    await fetch(
                        `${API}/votes`
                    );


                if (!votesResponse.ok) {

                    throw new Error(
                        "Unable to load votes."
                    );

                }


                const allVotes =
                    await votesResponse.json();


                // Only votes belonging to this election

                votes =
                    allVotes.filter(
                        vote =>
                            Number(vote.electionId) ===
                            Number(currentElection.id)
                    );


                // --------------------------------------
                // SUMMARY
                // --------------------------------------

                await loadSummary();


                // --------------------------------------
                // DISPLAY RESULTS
                // --------------------------------------

                displayResults();

            }

            catch (error) {

                console.error(
                    "Error loading results:",
                    error
                );


                electionCard.innerHTML = `
                    <h3>
                        Error Loading Election
                    </h3>

                    <p>
                        ${escapeHTML(error.message)}
                    </p>
                `;


                resultsContainer.innerHTML = `
                    <div class="error-box">

                        <strong>
                            Unable to load election results.
                        </strong>

                        <br><br>

                        ${escapeHTML(error.message)}

                        <br><br>

                        Make sure the Spring Boot server
                        is running on port 8080.

                    </div>
                `;

            }

        }


        // ==========================================
        // DISPLAY ELECTION
        // ==========================================

        function displayElection() {

            const startTime =
                currentElection.startTime ||
                currentElection.startDate ||
                "Not set";


            const endTime =
                currentElection.endTime ||
                currentElection.endDate ||
                "Not set";


            electionCard.innerHTML = `

                <h3>
                    ${escapeHTML(
                currentElection.name ||
                "Unnamed Election"
            )}
                </h3>

                <p>
                    ${escapeHTML(
                currentElection.description ||
                "No description provided."
            )}
                </p>

                <p>
                    <strong>Start Date:</strong>
                    ${escapeHTML(
                formatDate(startTime)
            )}
                </p>

                <p>
                    <strong>End Date:</strong>
                    ${escapeHTML(
                formatDate(endTime)
            )}
                </p>

                <p>
                    <strong>Election ID:</strong>
                    ${escapeHTML(
                String(currentElection.id)
            )}
                </p>

            `;

        }


        // ==========================================
        // SUMMARY
        // ==========================================

        async function loadSummary() {

            /*
             * At this stage the voter API is not being
             * used by the results page.
             *
             * If voters are already stored in localStorage,
             * use them for the registered voter count.
             */

            let registeredVoters = 0;


            try {

                const storedVoters =
                    JSON.parse(
                        localStorage.getItem("voters")
                    ) || [];


                registeredVoters =
                    storedVoters.length;

            }

            catch (error) {

                registeredVoters = 0;

            }


            document.getElementById(
                "totalVoters"
            ).textContent =
                registeredVoters;


            // Unique voters who voted

            const uniqueVoters =
                new Set(
                    votes
                        .map(
                            vote =>
                                vote.voterId
                        )
                        .filter(
                            voterId =>
                                voterId !== null &&
                                voterId !== undefined
                        )
                );


            document.getElementById(
                "votersWhoVoted"
            ).textContent =
                uniqueVoters.size;


            // Actual database vote records

            document.getElementById(
                "totalVotes"
            ).textContent =
                votes.length;

        }


        // ==========================================
        // DISPLAY RESULTS
        // ==========================================

        function displayResults() {

            resultsContainer.innerHTML = "";


            if (!positions ||
                positions.length === 0) {

                resultsContainer.innerHTML = `

                    <div class="no-data">

                        <h3>
                            No Positions Found
                        </h3>

                        <p>
                            Add election positions from
                            Manage Positions first.
                        </p>

                    </div>

                `;

                return;

            }


            positions.forEach(position => {

                // --------------------------------------
                // FIND CANDIDATES FOR THIS POSITION
                // --------------------------------------

                const positionCandidates =
                    candidates.filter(
                        candidate =>
                            Number(candidate.positionId) ===
                            Number(position.id)
                    );


                // --------------------------------------
                // CALCULATE VOTES
                // --------------------------------------

                const resultData =
                    positionCandidates.map(
                        candidate => {

                            const voteCount =
                                votes.filter(
                                    vote =>
                                        Number(
                                            vote.positionId
                                        ) ===
                                        Number(position.id)
                                        &&
                                        Number(
                                            vote.candidateId
                                        ) ===
                                        Number(candidate.id)
                                ).length;


                            return {

                                candidate:
                                    candidate,

                                votes:
                                    voteCount

                            };

                        }
                    );


                // --------------------------------------
                // TOTAL POSITION VOTES
                // --------------------------------------

                const totalPositionVotes =
                    resultData.reduce(
                        (
                            sum,
                            item
                        ) =>
                            sum + item.votes,
                        0
                    );


                // --------------------------------------
                // HIGHEST VOTE COUNT
                // --------------------------------------

                const highestVotes =
                    resultData.length > 0
                        ? Math.max(
                            ...resultData.map(
                                item =>
                                    item.votes
                            )
                        )
                        : 0;


                // --------------------------------------
                // POSITION SECTION
                // --------------------------------------

                const section =
                    document.createElement(
                        "div"
                    );


                section.className =
                    "position-section";


                section.innerHTML = `

                    <div class="position-title">

                        ${escapeHTML(
                    position.name
                )}

                    </div>

                    <div class="candidate-list">

                    </div>

                `;


                const candidateList =
                    section.querySelector(
                        ".candidate-list"
                    );


                // --------------------------------------
                // NO CANDIDATES
                // --------------------------------------

                if (
                    positionCandidates.length === 0
                ) {

                    candidateList.innerHTML = `

                        <div class="no-data">

                            No candidates have been added
                            for this position.

                        </div>

                    `;

                }


                // --------------------------------------
                // CANDIDATES
                // --------------------------------------

                else {

                    // Highest votes first

                    resultData.sort(
                        (a, b) =>
                            b.votes - a.votes
                    );


                    const tiedCandidates =
                        resultData.filter(
                            result =>
                                result.votes ===
                                highestVotes
                        ).length;


                    resultData.forEach(
                        item => {

                            const candidate =
                                item.candidate;


                            const voteCount =
                                item.votes;


                            // ----------------------------------
                            // PERCENTAGE
                            // ----------------------------------

                            const percentage =
                                totalPositionVotes > 0
                                    ? (
                                        voteCount /
                                        totalPositionVotes *
                                        100
                                    ).toFixed(1)
                                    : "0.0";


                            // ----------------------------------
                            // STATUS
                            // ----------------------------------

                            let statusHTML = "";


                            if (
                                highestVotes > 0 &&
                                voteCount ===
                                highestVotes
                            ) {

                                if (
                                    tiedCandidates > 1
                                ) {

                                    statusHTML = `
                                        <span
                                            class="status-badge tie"
                                        >
                                            TIE
                                        </span>
                                    `;

                                }

                                else {

                                    statusHTML = `
                                        <span
                                            class="status-badge leading"
                                        >
                                            LEADING
                                        </span>
                                    `;

                                }

                            }


                            // ----------------------------------
                            // PHOTO
                            // ----------------------------------

                            const photo = getCandidatePhotoUrl(candidate.photo);


                            // ----------------------------------
                            // CANDIDATE CARD
                            // ----------------------------------

                            const card =
                                document.createElement(
                                    "div"
                                );


                            card.className =
                                "candidate-card";


                            card.innerHTML = `

                                ${photo
                                    ? `
                                            <img
                                                class="candidate-photo"
                                                src="${escapeHTML(photo)}"
                                                alt="Candidate Photo"
                                                onerror="this.style.display='none';"
                                            >
                                          `
                                    : `
                                            <div
                                                class="candidate-photo"
                                                style="
                                                    display:flex;
                                                    align-items:center;
                                                    justify-content:center;
                                                    font-size:35px;
                                                "
                                            >
                                                👤
                                            </div>
                                          `
                                }


                                <div class="candidate-info">

                                    <h4>
                                        ${escapeHTML(
                                    candidate.name
                                )}
                                    </h4>

                                    <p>

                                        <strong>
                                            Email:
                                        </strong>

                                        ${escapeHTML(
                                    candidate.email ||
                                    "Not provided"
                                )}

                                    </p>

                                    <p>

                                        <strong>
                                            Candidate ID:
                                        </strong>

                                        ${escapeHTML(
                                    String(
                                        candidate.id
                                    )
                                )}

                                    </p>

                                    ${candidate.biography
                                    ? `
                                                <p>
                                                    ${escapeHTML(
                                        candidate.biography
                                    )}
                                                </p>
                                              `
                                    : ""
                                }

                                    ${statusHTML}

                                </div>


                                <div class="vote-count">

                                    <div class="number">
                                        ${voteCount}
                                    </div>

                                    <p>
                                        Vote${voteCount === 1
                                    ? ""
                                    : "s"}
                                    </p>

                                </div>


                                <div class="percentage">

                                    <div class="number">
                                        ${percentage}%
                                    </div>

                                    <p>
                                        Vote Share
                                    </p>

                                </div>

                            `;


                            candidateList.appendChild(
                                card
                            );

                        }
                    );

                }


                resultsContainer.appendChild(
                    section
                );

            });

        }


        // ==========================================
        // NO ELECTION
        // ==========================================

        function showNoElection() {

            electionCard.innerHTML = `

                <h3>
                    No Election Found
                </h3>

                <p>
                    Please create an election first.
                </p>

            `;


            resultsContainer.innerHTML = `

                <div class="no-data">

                    <h3>
                        No Results Available
                    </h3>

                    <p>
                        No election has been selected.
                    </p>

                </div>

            `;

        }


        // ==========================================
        // FORMAT DATE
        // ==========================================

        function formatDate(value) {

            if (!value ||
                value === "Not set") {

                return "Not set";

            }


            try {

                const date =
                    new Date(value);


                if (
                    isNaN(
                        date.getTime()
                    )
                ) {

                    return value;

                }


                return date.toLocaleString(
                    "en-IN",
                    {
                        day: "2-digit",
                        month: "short",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

            }

            catch (error) {

                return value;

            }

        }


        // ==========================================
        // BACK TO DASHBOARD
        // ==========================================

        function goBack() {

            window.location.href =
                "admin-dashboard.html";

        }


        // ==========================================
        // SECURITY / HTML ESCAPE
        // ==========================================

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }

        function getCandidatePhotoUrl(photo) {
            if (!photo || !String(photo).trim()) return "";

            const value = String(photo).trim();
            const backendOrigin = new URL(API).origin;

            if (/^https?:\/\//i.test(value)) return value;
            if (value.startsWith("/")) return backendOrigin + value;

            return backendOrigin + "/uploads/" + encodeURIComponent(value);
        }

        // ==========================================
        // START
        // ==========================================

        loadResults();

    </script>

</body>

</html>
